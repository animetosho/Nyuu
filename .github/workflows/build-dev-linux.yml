name: Build dev Linux binary
on:
  workflow_dispatch:

jobs:
  build-dev-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
        - target: x86_64
          arch: x64
          xz_bcj: --x86
          name: amd64
          prefix: x86_64-linux-musl
        - target: arm_64
          arch: arm64
          xz_bcj: 
          name: aarch64
          prefix: aarch64-linux-musl
        # disabled due to compiler crashing
        #- target: arm_hf
        #  arch: arm
        #  xz_bcj: --arm
        #  name: armhf
        #  prefix: arm-linux-musleabihf
    name: Build ${{ matrix.name }} dev Linux binary
    runs-on: ubuntu-latest
    env:
      BUILD_ARCH: ${{ matrix.arch }}
      BUILD_LOGLEVEL: verbose
      BUILD_CONFIGURE: '--with-arm-float-abi=hard --with-arm-fpu=vfpv3-d16'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.9' # workaround "cannot import name 'Mapping' from 'collections'" error
      - uses: dyne/musl-action@main
        id: musl
        with:
          target_arch: ${{ matrix.target }}
      - name: Install i386 dev
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update
          sudo apt install -y libstdc++-$(c++ -dumpversion)-dev:i386 libc6-dev:i386 g++-multilib
        if: ${{ matrix.arch == 'arm' }}
      - run: npm install --omit=dev --no-ignore-scripts
      - run: npm install --omit=dev
        working-directory: nexe
      - run: node build
        working-directory: nexe
        env:
          CC: ${{ matrix.prefix }}-cc
          CXX: ${{ matrix.prefix }}-c++
          CC_host: cc
          CXX_host: c++
      - run: ${{ matrix.prefix }}-strip nexe/nyuu
      - run: tar --group=nobody --owner=nobody -cf - -C nexe nyuu ../config-sample.json | xz -9e ${{ matrix.xz_bcj }} --lzma2 > nyuu.txz
      - uses: actions/upload-artifact@v4
        with:
          path: ./nyuu.txz
          name: nyuu-${{ github.ref_name }}-linux-${{ matrix.name }}.7z
          retention-days: 5
